<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <title>Roundtable — Multi-model AI conversation</title>

  <!--
    Square OG social image for Roundtable. Rebuilt 2026-08-05.
    Canvas: 600 × 600 px (square format for LinkedIn, Instagram, etc.)
    Theme: Midnight — same palette as the rectangle variant.

    Brand palette (on-dark variant):
      Background:         Midnight bg       #060B18
      Mark / wordmark:    Roundtable Mist   #C4C2E8
      Tagline:            Secondary text    #94A3C8
      Divider:            Midnight border   #1E2D4A
      Card surface:       Midnight card     #0D1525
      Card label rects:   Dark blue         #1A2840

    Model accent colors:
      Claude:   amber   #FBB034
      GPT:      teal    #00CDB8
      User:     indigo  #A5B4FC

    Layout (rebuilt):
      Mark:        center (300, 90) — ghost r=45, ring r=28
      Wordmark:    y=183 (centered x=300), font-size=26
      Tagline:     y=227 (centered x=300), font-size=17
      Rule:        y=247, x1=120 to x2=480
      User bubble: y=261, h=44, w=260 (x=300 to x=560, right-aligned)
      Claude card: y=317, h=115, w=480 (x=80, left-aligned)
      GPT card:    y=444, h=115, w=440 (x=80, left-aligned)

      Spacing:
        Ghost top: 90-45=45px padding. Ghost bottom: 90+45=135.
        Wordmark 183. Gap mark→wordmark: 183-135=48px.
        Tagline 227. Gap wordmark→tagline: 227-183=44px.
        Both ~2× prior gaps.

        Claude card bottom: 317+115=432. GPT card y: 444. Gap: 12px.
        GPT card bottom: 444+115=559. Bottom padding: 41px. Ghost top: 45px. Balanced.

    Mark geometry (centered at 300, 90):
      Ghost halo:  r=45, #C4C2E8 at 5% opacity
      Ring:        r=28, stroke 4px, #C4C2E8
      Seat dots:   r=6, #C4C2E8, pointy-top on ring (r=28)
        Top:          (300,   62)   = cy - 28
        Upper-right:  (324.2, 76)   = cx+24.2, cy-14
        Lower-right:  (324.2, 104)  = cx+24.2, cy+14
        Bottom:       (300,   118)  = cy + 28
        Lower-left:   (275.8, 104)  = cx-24.2, cy+14
        Upper-left:   (275.8, 76)   = cx-24.2, cy-14
      Center dot:  r=7, #C4C2E8

    Bubble group shifted +60px right vs. prior version to center on 600px canvas.
  -->

  <defs>
    <!-- Background radial gradient — same as rectangle -->
    <radialGradient id="sq-bg-gradient" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#101825"/>
      <stop offset="100%" stop-color="#060B18"/>
    </radialGradient>

    <!-- Glow gradients — sq- prefix to avoid collisions if SVGs are ever merged -->
    <linearGradient id="sq-glow-user" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sq-glow-claude" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBB034" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FBB034" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sq-glow-gpt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00CDB8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00CDB8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#sq-bg-gradient)"/>

  <!-- ============================================================
       MARK — centered at (300, 90), repositioned upward
       ============================================================ -->
  <g id="sq-symbol">
    <!-- Ghost halo: r=45, Mist at 5% opacity -->
    <circle cx="300" cy="90" r="45" fill="#C4C2E8" fill-opacity="0.05"/>

    <!-- Ring: r=28, stroke 4px, Mist -->
    <circle cx="300" cy="90" r="28" fill="none" stroke="#C4C2E8" stroke-width="4"/>

    <!-- Six seat dots: r=6, Mist, pointy-top arrangement on ring r=28 -->
    <circle cx="300"   cy="62"    r="6" fill="#C4C2E8"/>  <!-- Top -->
    <circle cx="324.2" cy="76"    r="6" fill="#C4C2E8"/>  <!-- Upper-right -->
    <circle cx="324.2" cy="104"   r="6" fill="#C4C2E8"/>  <!-- Lower-right -->
    <circle cx="300"   cy="118"   r="6" fill="#C4C2E8"/>  <!-- Bottom -->
    <circle cx="275.8" cy="104"   r="6" fill="#C4C2E8"/>  <!-- Lower-left -->
    <circle cx="275.8" cy="76"    r="6" fill="#C4C2E8"/>  <!-- Upper-left -->

    <!-- Center dot: r=7, Mist -->
    <circle cx="300" cy="90" r="7" fill="#C4C2E8"/>
  </g>

  <!-- ============================================================
       WORDMARK — centered at x=300, y=183
       ============================================================ -->
  <text
    x="300"
    y="183"
    text-anchor="middle"
    font-family="'Space Grotesk', 'DM Sans', system-ui, -apple-system, sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="3"
    fill="#C4C2E8"
  >ROUNDTABLE</text>

  <!-- ============================================================
       TAGLINE — centered at x=300, y=227, font-size=17
       ============================================================ -->
  <text
    x="300"
    y="227"
    text-anchor="middle"
    font-family="'Space Grotesk', 'DM Sans', system-ui, -apple-system, sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="1.5"
    fill="#94A3C8"
  >Multi-model AI conversation</text>

  <!-- ============================================================
       RULE — horizontal divider
       ============================================================ -->
  <line x1="120" y1="247" x2="480" y2="247" stroke="#1E2D4A" stroke-width="1"/>

  <!-- ============================================================
       USER BUBBLE — right-aligned, y=261, h=44, w=260 (x=300 to x=560)
       Shifted +60px right vs. prior (was x=240 to x=500)
       ============================================================ -->
  <g id="sq-bubble-user">
    <!-- Body -->
    <rect x="300" y="261" width="260" height="44" rx="8" fill="#0D1525" stroke="#1E2D4A" stroke-width="1"/>
    <!-- Glow wash -->
    <rect x="300" y="261" width="260" height="44" rx="8" fill="url(#sq-glow-user)"/>
    <!-- Left accent bar -->
    <rect x="301" y="267" width="4"   height="32" rx="2" fill="#A5B4FC"/>
    <!-- User dot -->
    <circle cx="319" cy="283" r="4" fill="#A5B4FC"/>
    <!-- Label rect -->
    <rect x="329" y="278" width="28"  height="8"  rx="4" fill="#1A2840"/>
    <!-- Content line -->
    <rect x="308" y="291" width="180" height="7"  rx="3" fill="#1A2840"/>
  </g>

  <!-- ============================================================
       CARD 1 — Claude amber #FBB034, y=317, h=115, w=480 (x=80, left-aligned)
       Shifted +60px right vs. prior (was x=20)
       ============================================================ -->
  <g id="sq-card-claude">
    <!-- Card body -->
    <rect x="80"  y="317" width="480" height="115" rx="8" fill="#0D1525" stroke="#1E2D4A" stroke-width="1"/>
    <!-- Glow wash -->
    <rect x="80"  y="317" width="480" height="115" rx="8" fill="url(#sq-glow-claude)"/>
    <!-- Left accent bar -->
    <rect x="81"  y="323" width="4"   height="103" rx="2" fill="#FBB034"/>
    <!-- Model dot -->
    <circle cx="99"  cy="335" r="4" fill="#FBB034"/>
    <!-- Model label rect -->
    <rect x="109" y="330" width="42"  height="8"   rx="4" fill="#1A2840"/>
    <!-- Content lines -->
    <rect x="87"  y="353" width="370" height="7"   rx="3" fill="#1A2840"/>
    <rect x="87"  y="368" width="310" height="7"   rx="3" fill="#1A2840"/>
    <rect x="87"  y="383" width="240" height="7"   rx="3" fill="#152035"/>
    <rect x="87"  y="398" width="290" height="7"   rx="3" fill="#152035"/>
  </g>

  <!-- ============================================================
       CARD 2 — GPT teal #00CDB8, y=444, h=115, w=440 (x=80, left-aligned)
       Shifted +60px right vs. prior (was x=20)
       ============================================================ -->
  <g id="sq-card-gpt">
    <!-- Card body -->
    <rect x="80"  y="444" width="440" height="115" rx="8" fill="#0D1525" stroke="#1E2D4A" stroke-width="1"/>
    <!-- Glow wash -->
    <rect x="80"  y="444" width="440" height="115" rx="8" fill="url(#sq-glow-gpt)"/>
    <!-- Left accent bar -->
    <rect x="81"  y="450" width="4"   height="103" rx="2" fill="#00CDB8"/>
    <!-- Model dot -->
    <circle cx="99"  cy="462" r="4" fill="#00CDB8"/>
    <!-- Model label rect -->
    <rect x="109" y="457" width="38"  height="8"   rx="4" fill="#1A2840"/>
    <!-- Content lines -->
    <rect x="87"  y="480" width="330" height="7"   rx="3" fill="#1A2840"/>
    <rect x="87"  y="495" width="270" height="7"   rx="3" fill="#1A2840"/>
    <rect x="87"  y="510" width="200" height="7"   rx="3" fill="#152035"/>
    <rect x="87"  y="525" width="250" height="7"   rx="3" fill="#152035"/>
  </g>

</svg>
